name: Windows tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $guardTokens = $null
            $guardErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$guardTokens, [ref]$guardErrors) | Out-Null
            if ($guardErrors.Count) { throw ($guardErrors | Out-String) }
          }
      - name: Build isolated firewall probe
        shell: powershell
        run: .\build-probe.ps1
